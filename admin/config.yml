backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "content"
    label: "Site Content"
    files:
      - name: "content"
        label: "Roster, Captains, Board, Founders & Partners"
        file: "data/content.json"
        fields:
          - label: "Ticker Banner Text"
            name: "ticker"
            widget: "string"
            hint: "The scrolling announcement bar at the very top of the site"

          - label: "Weekly Runs"
            name: "weeklyRuns"
            widget: "list"
            summary: "{{fields.day}} {{fields.time}} — {{fields.name}}"
            fields:
              - { label: "Day", name: "day", widget: "select", options: ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"] }
              - { label: "Time (24-hour, e.g. 18:00 for 6 PM)", name: "time", widget: "string" }
              - { label: "Run Name", name: "name", widget: "string" }
              - { label: "Details", name: "meta", widget: "string" }
              - { label: "Distance", name: "distance", widget: "string" }

          - label: "Races & Events"
            name: "events"
            widget: "list"
            summary: "{{fields.date}} — {{fields.name}}"
            fields:
              - { label: "Date", name: "date", widget: "date", date_format: "YYYY-MM-DD" }
              - { label: "Event Name", name: "name", widget: "string" }
              - { label: "Details", name: "meta", widget: "string" }
              - { label: "Distance", name: "distance", widget: "string" }

          - label: "Club Roster"
            name: "roster"
            widget: "list"
            summary: "{{fields.name}} — bib {{fields.bib}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Bib Number", name: "bib", widget: "string" }
              - { label: "Pace Group", name: "paceGroup", widget: "string", hint: "e.g. Sub-7, 7:00–8:00, Run-Walk" }
              - { label: "Weekly Miles", name: "weeklyMiles", widget: "string" }
              - { label: "Year Joined", name: "joined", widget: "string" }
              - { label: "Role (leave blank for none)", name: "role", widget: "string", required: false, hint: "e.g. Captain, Board" }

          - label: "Run Captains"
            name: "captains"
            widget: "list"
            summary: "{{fields.name}} — {{fields.title}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Initials (shown as photo placeholder)", name: "initials", widget: "string" }
              - { label: "Bib Number", name: "bib", widget: "string" }
              - { label: "Title", name: "title", widget: "string", hint: "e.g. Tuesday Speed Captain" }
              - { label: "Short Bio", name: "blurb", widget: "text" }

          - label: "Board Members"
            name: "board"
            widget: "list"
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Initials (shown as photo placeholder)", name: "initials", widget: "string" }
              - { label: "Role", name: "role", widget: "string", hint: "e.g. President, Treasurer" }
              - { label: "Short Bio", name: "blurb", widget: "text" }

          - label: "Founders"
            name: "founders"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Initials (shown as photo placeholder)", name: "initials", widget: "string" }
              - { label: "Badge (optional, e.g. EST. 2024)", name: "badge", widget: "string", required: false }
              - { label: "Bio", name: "blurb", widget: "text" }

          - label: "Partners / Sponsors"
            name: "partners"
            widget: "list"
            summary: "{{fields.name}} — {{fields.tier}}"
            fields:
              - { label: "Sponsor Name", name: "name", widget: "string" }
              - { label: "Mark / Initials (shown as logo placeholder)", name: "mark", widget: "string" }
              - { label: "Tier", name: "tier", widget: "string", hint: "e.g. Media Partner, Fitness Partner" }
              - { label: "Description", name: "blurb", widget: "text" }
